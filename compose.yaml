services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: fwwebsite:production
    container_name: fwwebsite
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
